<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型配置弹窗 - 统一视觉风格</title>
    <style>
        /* 基础重置和演示背景 */
        body {
            margin: 0;
            padding: 0;
            background-color: #111; /* 外层背景 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 弹窗主体容器 */
        .config-modal {
            background-color: #050505; /* 极暗的主体背景色 */
            width: 520px;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #1a1a1a; /* 极暗的外边框，提升质感 */
            display: flex;
            flex-direction: column;
        }

        /* 头部区域 */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }
        .modal-header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .close-btn {
            color: #666666;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .close-btn:hover {
            color: #cccccc;
        }

        /* 标签页区域 */
        .tabs-container {
            display: flex;
            gap: 30px;
            padding: 0 24px;
            border-bottom: 1px solid #222222; /* 统一下划线颜色 */
        }
        .tab {
            padding: 12px 0;
            color: #777777;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }
        .tab:hover {
            color: #aaaaaa;
        }
        .tab.active {
            color: #ccff00; /* 使用荧光绿强调色 */
            font-weight: 500;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #ccff00; /* 荧光绿下划线 */
        }

        /* 核心内容区域 */
        .modal-content {
            padding: 24px;
        }
        .section-title {
            color: #aaaaaa;
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* 服务商列表 */
        .provider-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .provider-card {
            background-color: #141414; /* 卡片使用深灰色，与登录输入框同色 */
            border: 1px solid #222222;
            border-radius: 4px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s;
        }
        .provider-card:hover {
            border-color: #333333;
        }
        
        .provider-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .provider-name {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
        }
        .provider-url {
            color: #666666;
            font-size: 12px;
        }

        /* 卡片内的使用按钮 */
        .use-btn {
            background: transparent;
            border: 1px solid #333333;
            color: #888888;
            padding: 6px 18px;
            border-radius: 2px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .use-btn:hover {
            border-color: #555555;
            color: #ffffff;
        }
        /* 激活状态按钮使用荧光绿 */
        .use-btn.active {
            border-color: #ccff00;
            color: #ccff00;
        }

        /* 提示文字 */
        .helper-text {
            color: #666666;
            font-size: 12px;
            margin-top: 16px;
        }

        /* 底部操作区 */
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #222222;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 2px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-cancel {
            background: transparent;
            border: 1px solid #222222;
            color: #aaaaaa;
        }
        .btn-cancel:hover {
            border-color: #444444;
            color: #ffffff;
        }
        
        /* 确认按钮使用登录弹窗的橄榄绿 */
        .btn-save {
            background-color: #5c7400; 
            color: #1a2200;
            border: none;
            font-weight: 600;
        }
        .btn-save:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="config-modal">
        <!-- 头部 -->
        <div class="modal-header">
            <h2>模型配置</h2>
            <div class="close-btn">✕</div>
        </div>

        <!-- 标签页 -->
        <div class="tabs-container">
            <div class="tab active">文本模型</div>
            <div class="tab">图像模型</div>
        </div>

        <!-- 内容列表 -->
        <div class="modal-content">
            <div class="section-title">选择 API 服务商</div>
            
            <div class="provider-list">
                <!-- 卡片 1 -->
                <div class="provider-card">
                    <div class="provider-info">
                        <div class="provider-name">Comfly</div>
                        <div class="provider-url">https://ai.comfly.org</div>
                    </div>
                    <button class="use-btn">使用</button>
                </div>

                <!-- 卡片 2 (激活状态) -->
                <div class="provider-card">
                    <div class="provider-info">
                        <div class="provider-name">VibeAPI</div>
                        <div class="provider-url">https://www.vibeapi.cn</div>
                    </div>
                    <button class="use-btn active">使用</button>
                </div>

                <!-- 卡片 3 -->
                <div class="provider-card">
                    <div class="provider-info">
                        <div class="provider-name">真真 AI 工坊</div>
                        <div class="provider-url">https://ai.t8star.cn</div>
                    </div>
                    <button class="use-btn">使用</button>
                </div>
            </div>

            <div class="helper-text">切换服务商时，请先填写对应 API Key 再确认。</div>
        </div>

        <!-- 底部按钮 -->
        <div class="modal-footer">
            <button class="btn btn-cancel">取消</button>
            <button class="btn btn-save">保存</button>
        </div>
    </div>

</body>
</html>
