<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录弹窗复刻</title>
    <style>
        /* 基础重置和背景设置 (为了演示居中效果) */
        body {
            margin: 0;
            padding: 0;
            background-color: #111; /* 外层背景，突出弹窗 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 弹窗主体容器 */
        .login-modal {
            background-color: #050505; /* 极暗的背景色 */
            width: 380px;
            padding: 40px 30px;
            border-radius: 4px;
            position: relative;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover {
            color: #ccc;
        }

        /* 头部样式 */
        .header {
            margin-bottom: 35px;
        }
        .accent-line {
            width: 35px;
            height: 3px;
            background-color: #ccff00; /* 荧光绿装饰线 */
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .header p {
            color: #666666;
            font-size: 13px;
            margin: 0;
            letter-spacing: 1px;
        }

        /* 表单输入区域 */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            color: #777777;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #141414;
            border: 1px solid #222222;
            border-radius: 2px;
            padding: 0 15px;
            height: 44px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: #444;
        }
        
        .prefix {
            color: #777;
            font-size: 14px;
            margin-right: 10px;
        }
        
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            width: 100%;
            height: 100%;
            outline: none;
        }
        input::placeholder {
            color: #444444; /* 占位符颜色 */
        }

        /* 协议部分 */
        .agreement {
            color: #777777;
            font-size: 12px;
            margin: 25px 0;
        }
        .agreement a {
            color: #ccff00; /* 荧光绿链接 */
            text-decoration: none;
        }
        .agreement a:hover {
            text-decoration: underline;
        }

        /* 登录按钮 */
        .submit-btn {
            width: 100%;
            height: 48px;
            background-color: #5c7400; /* 橄榄绿背景 */
            color: #1a2200; /* 深色文字 */
            border: none;
            border-radius: 2px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }

        /* 分割线 OR */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #444444;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #222222; /* 细分隔线 */
        }
        .divider::before {
            margin-right: 15px;
        }
        .divider::after {
            margin-left: 15px;
        }

        /* 底部其他登录方式按钮 */
        .alt-login-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .alt-btn {
            flex: 1;
            height: 42px;
            background: transparent;
            border: 1px solid #222222;
            color: #aaaaaa;
            border-radius: 2px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .alt-btn:hover {
            border-color: #444;
            color: #fff;
        }

        /* 最底部链接 */
        .footer-link {
            text-align: center;
        }
        .footer-link a {
            color: #666666;
            font-size: 12px;
            text-decoration: none;
        }
        .footer-link a:hover {
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="login-modal">
        <div class="close-btn">✕</div>
        
        <div class="header">
            <div class="accent-line"></div>
            <h1>登录</h1>
            <p>连接灵感，驱动生成</p>
        </div>

        <form action="#" method="POST">
            <div class="input-group">
                <label>账号</label>
                <div class="input-wrapper">
                    <span class="prefix">+86</span>
                    <input type="text" placeholder="请输入手机号">
                </div>
            </div>

            <div class="input-group">
                <label>密码</label>
                <div class="input-wrapper">
                    <input type="password" placeholder="请输入密码">
                </div>
            </div>

            <div class="agreement">
                登录即代表同意 <a href="#">用户服务协议</a> 和 <a href="#">隐私政策</a>
            </div>

            <button type="button" class="submit-btn">立即登录</button>
        </form>

        <div class="divider">OR</div>

        <div class="alt-login-container">
            <button class="alt-btn">微信登录</button>
            <button class="alt-btn">验证码登录</button>
        </div>

        <div class="footer-link">
            <a href="#">其他登录方式</a>
        </div>
    </div>

</body>
</html>
