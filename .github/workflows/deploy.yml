name: Deploy to Aliyun

on:
  push:
    branches:
      - master

concurrency:
  group: aliyun-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GenLink app
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.ALIYUN_SERVER_HOST }}
          SERVER_PORT: ${{ secrets.ALIYUN_SERVER_PORT }}
          SERVER_USER: ${{ secrets.ALIYUN_SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.ALIYUN_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/aliyun_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /www/GenLink_app

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Server working tree has changes to tracked files. Commit, stash, or clean them before deploying."
            git status --short
            exit 1
          fi

          git fetch origin master
          git checkout master
          git pull --ff-only origin master

          npm ci
          npm run build

          pm2 restart genlink-app --update-env
          pm2 save
          REMOTE
