name: Deploy to Aliyun

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rollback_release:
        description: "Release folder name to roll back to. Leave empty to use the previous release."
        required: false
        type: string

concurrency:
  group: aliyun-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GenLink app
    runs-on: ubuntu-latest
    steps:
      - name: Deploy or roll back over SSH
        env:
          SERVER_HOST: ${{ secrets.ALIYUN_SERVER_HOST }}
          SERVER_PORT: ${{ secrets.ALIYUN_SERVER_PORT }}
          SERVER_USER: ${{ secrets.ALIYUN_SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.ALIYUN_SERVER_SSH_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          ROLLBACK_RELEASE: ${{ github.event.inputs.rollback_release }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -i ~/.ssh/aliyun_deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "EVENT_NAME='$EVENT_NAME' RELEASE_SHA='$RELEASE_SHA' ROLLBACK_RELEASE='$ROLLBACK_RELEASE' bash -se" <<'REMOTE'
          set -euo pipefail

          APP_NAME="genlink-agent-test"
          LEGACY_PM2_APP="genlink-app"
          LEGACY_APP="/www/GenLink_app"
          RELEASES="/www/GenLink_releases"
          SHARED="/www/GenLink_shared"
          CURRENT="/www/GenLink_current"
          KEEP_RELEASES=3
          WORKER_NAME="genlink-media-worker"
          WORKER_PORT="8080"
          WORKER_VENV="/www/GenLink_worker_venv"

          load_shared_env() {
            eval "$(
              ENV_FILE="$SHARED/.env.production" python3 - <<'PY'
          import os
          import shlex
          from pathlib import Path

          env_file = Path(os.environ["ENV_FILE"])
          for raw_line in env_file.read_text(encoding="utf-8-sig").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key:
                  print(f"export {key}={shlex.quote(value)}")
          PY
            )"
          }

          remove_env_var() {
            local key="$1"
            local file="$SHARED/.env.production"

            if [ -f "$file" ]; then
              sed -i "/^${key}=/d" "$file"
            fi
          }

          restart_app() {
            cd "$CURRENT"
            load_shared_env
            export NEXT_PUBLIC_APP_VERSION
            NEXT_PUBLIC_APP_VERSION="$(git rev-parse --short=12 HEAD)"
            export OPENCLAW_CLI_ENTRY="${OPENCLAW_CLI_ENTRY:-/www/GenLink-runtime/openclaw/openclaw.mjs}"
            export OPENCLAW_CONFIG_PATH="${OPENCLAW_CONFIG_PATH:-/www/GenLink-runtime/openclaw-genlink.json}"
            export OPENCLAW_STATE_DIR="${OPENCLAW_STATE_DIR:-/www/GenLink-runtime/state}"
            export OPENCLAW_WORKSPACE_DIR="${OPENCLAW_WORKSPACE_DIR:-/www/GenLink-runtime/workspaces/genlink-planf}"
            export GENLINK_OPENCLAW_TEXT_BASE_URL="${GENLINK_OPENCLAW_TEXT_BASE_URL:-https://ai.comfly.org/v1}"
            export OPENCLAW_AGENT_MODEL="${OPENCLAW_AGENT_MODEL:-gpt-5.4-mini}"
            unset GENLINK_AGENT_BACKEND_URL

            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
            pm2 delete "$LEGACY_PM2_APP" >/dev/null 2>&1 || true
            PORT=3002 pm2 start npm --name "$APP_NAME" -- run start -- -p 3002
            sleep 3
            if ! curl -fsS "http://127.0.0.1:3002/api/app-version" | grep -q "$NEXT_PUBLIC_APP_VERSION"; then
              pm2 logs "$APP_NAME" --lines 80 --nostream || true
              exit 1
            fi
            pm2 save
          }

          upsert_env_var() {
            local key="$1"
            local value="$2"
            local file="$SHARED/.env.production"

            if grep -q "^${key}=" "$file"; then
              sed -i "s#^${key}=.*#${key}=\"${value}\"#" "$file"
            else
              printf '%s="%s"\n' "$key" "$value" >> "$file"
            fi
          }

          restart_worker() {
            if ! command -v python3.11 >/dev/null 2>&1; then
              echo "python3.11 is not installed. Install python3.11 and python3.11-pip before deploying media worker."
              exit 1
            fi

            mkdir -p "$SHARED/media-worker"
            if [ ! -x "$WORKER_VENV/bin/python" ]; then
              python3.11 -m venv "$WORKER_VENV"
            fi

            "$WORKER_VENV/bin/python" -m pip install --upgrade pip
            "$WORKER_VENV/bin/python" -m pip install -r "$CURRENT/media-worker/requirements.txt"

            pm2 delete "$WORKER_NAME" >/dev/null 2>&1 || true
            cd "$CURRENT/media-worker"
            eval "$("$WORKER_VENV/bin/python" - <<'PY'
          from pathlib import Path
          import shlex

          env_file = Path("/www/GenLink_shared/.env.production")
          for raw_line in env_file.read_text(encoding="utf-8-sig").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key:
                  print(f"export {key}={shlex.quote(value)}")
          PY
          )"
            MEDIA_WORKER_STATE_DB="$SHARED/media-worker/jobs.sqlite3" \
              pm2 start "$WORKER_VENV/bin/python" \
                --name "$WORKER_NAME" \
                -- -m uvicorn app.main:app --host 127.0.0.1 --port "$WORKER_PORT"
            sleep 3
            if ! curl -fsS "http://127.0.0.1:${WORKER_PORT}/health" >/dev/null; then
              pm2 logs "$WORKER_NAME" --lines 80 --nostream || true
              exit 1
            fi
            pm2 save
          }

          latest_previous_release() {
            local current_real
            current_real="$(readlink -f "$CURRENT" 2>/dev/null || true)"

            find "$RELEASES" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | cut -d' ' -f2- \
              | while IFS= read -r release_path; do
                  if [ "$(readlink -f "$release_path")" != "$current_real" ]; then
                    printf '%s\n' "$release_path"
                    break
                  fi
                done
          }

          prune_old_releases() {
            local current_real count
            current_real="$(readlink -f "$CURRENT" 2>/dev/null || true)"
            count=0

            find "$RELEASES" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | cut -d' ' -f2- \
              | while IFS= read -r release_path; do
                  count=$((count + 1))
                  if [ "$count" -gt "$KEEP_RELEASES" ] && [ "$(readlink -f "$release_path")" != "$current_real" ]; then
                    rm -rf "$release_path"
                  fi
                done
          }

          mkdir -p "$RELEASES" "$SHARED/prisma"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${ROLLBACK_RELEASE:-}" ]; then
              TARGET="$RELEASES/$ROLLBACK_RELEASE"
            else
              TARGET="$(latest_previous_release)"
            fi

            if [ -z "${TARGET:-}" ] || [ ! -d "$TARGET" ]; then
              echo "No rollback target found."
              echo "Available releases:"
              find "$RELEASES" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -r || true
              exit 1
            fi

            ln -sfn "$TARGET" "$CURRENT"
            restart_app
            echo "Rolled back to $(basename "$TARGET")."
            exit 0
          fi

          if [ ! -d "$LEGACY_APP/.git" ]; then
            echo "Missing legacy git repository at $LEGACY_APP."
            exit 1
          fi

          if [ ! -f "$SHARED/.env.production" ]; then
            if [ ! -f "$LEGACY_APP/.env.production" ]; then
              echo "Missing .env.production. Put it at $SHARED/.env.production or $LEGACY_APP/.env.production."
              exit 1
            fi
            cp -p "$LEGACY_APP/.env.production" "$SHARED/.env.production"
          fi

          if [ ! -f "$SHARED/prisma/dev.db" ]; then
            if [ ! -f "$LEGACY_APP/prisma/dev.db" ]; then
              echo "Missing SQLite database. Put it at $SHARED/prisma/dev.db or $LEGACY_APP/prisma/dev.db."
              exit 1
            fi
            cp -p "$LEGACY_APP/prisma/dev.db" "$SHARED/prisma/dev.db"
          fi

          upsert_env_var "MEDIA_WORKER_BASE_URL" "http://127.0.0.1:${WORKER_PORT}"
          upsert_env_var "OPENCLAW_CLI_ENTRY" "/www/GenLink-runtime/openclaw/openclaw.mjs"
          upsert_env_var "OPENCLAW_CONFIG_PATH" "/www/GenLink-runtime/openclaw-genlink.json"
          upsert_env_var "OPENCLAW_STATE_DIR" "/www/GenLink-runtime/state"
          upsert_env_var "OPENCLAW_WORKSPACE_DIR" "/www/GenLink-runtime/workspaces/genlink-planf"
          upsert_env_var "GENLINK_OPENCLAW_TEXT_BASE_URL" "https://ai.comfly.org/v1"
          upsert_env_var "OPENCLAW_AGENT_MODEL" "gpt-5.4-mini"
          upsert_env_var "NEXT_PUBLIC_IMAGE_UPLOAD_MODE" "server"
          upsert_env_var "NEXT_PUBLIC_IMAGE_CDN_BASE_URL" "https://img.zerinnai.online"
          upsert_env_var "NEXT_PUBLIC_IMAGE_CDN_SOURCE_HOST" "genlink-img.oss-cn-guangzhou.aliyuncs.com"
          remove_env_var "GENLINK_AGENT_BACKEND_URL"

          cd "$LEGACY_APP"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Server source repository has changes to tracked files. Commit, stash, or clean them before deploying."
            git status --short
            exit 1
          fi

          git fetch origin master

          RELEASE_NAME="$(date +%Y%m%d%H%M%S)-${RELEASE_SHA:0:7}"
          RELEASE_DIR="$RELEASES/$RELEASE_NAME"

          git clone "$LEGACY_APP" "$RELEASE_DIR"
          cd "$RELEASE_DIR"
          git checkout --detach "$RELEASE_SHA"

          ln -sfn "$SHARED/.env.production" "$RELEASE_DIR/.env.production"
          rm -f "$RELEASE_DIR/prisma/dev.db"
          ln -sfn "$SHARED/prisma/dev.db" "$RELEASE_DIR/prisma/dev.db"

          NPM_CACHE="$SHARED/npm-cache"
          NPM_REGISTRY="https://registry.npmmirror.com"
          DEPLOY_NPM_VERSION="11.12.1"
          DEPLOY_NPM="npx -y npm@${DEPLOY_NPM_VERSION}"
          export npm_config_registry="$NPM_REGISTRY"
          export NPM_CONFIG_REGISTRY="$NPM_REGISTRY"
          mkdir -p "$NPM_CACHE"
          node --version
          npm --version
          npm config get registry
          $DEPLOY_NPM --version
          install_dependencies() {
            local current_real
            current_real="$(readlink -f "$CURRENT" 2>/dev/null || true)"

            if [ -n "$current_real" ] \
              && [ -d "$current_real/node_modules" ] \
              && [ -f "$current_real/package.json" ] \
              && [ -f "$current_real/package-lock.json" ] \
              && cmp -s "$current_real/package.json" "$RELEASE_DIR/package.json" \
              && cmp -s "$current_real/package-lock.json" "$RELEASE_DIR/package-lock.json"; then
              echo "Reusing node_modules from current release because package files are unchanged."
              cp -a "$current_real/node_modules" "$RELEASE_DIR/node_modules"
              return
            fi

            npm_ci() {
              $DEPLOY_NPM ci \
                --no-audit \
                --no-fund \
                --no-progress \
                --prefer-offline \
                --cache "$NPM_CACHE"
            }

            if ! npm_ci; then
              echo "npm ci failed. Cleaning npm cache and retrying once."
              $DEPLOY_NPM --cache "$NPM_CACHE" cache clean --force || true
              npm_ci
            fi
          }
          install_dependencies
          export NEXT_PUBLIC_APP_VERSION
          NEXT_PUBLIC_APP_VERSION="$(git rev-parse --short=12 HEAD)"
          npm run build

          ln -sfn "$RELEASE_DIR" "$CURRENT"
          restart_worker
          restart_app
          prune_old_releases

          echo "Deployed $RELEASE_NAME."
          REMOTE
